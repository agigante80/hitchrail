<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>hitchrail</title>
<!--
  SELF CONTAINED, on purpose. This is the only page served without a token, and
  every asset route stays behind one, so a linked stylesheet or an external
  script here would be answered 401 and the page would arrive unstyled and
  inert. Exempting the assets as well would grow the unauthenticated surface,
  which is exactly what choosing a dedicated route over the app shell avoided.

  The palette below is the subset of the main stylesheet this page uses. It is
  duplicated, and that is the cost of the boundary; a test asserts the two
  agree so it cannot drift silently. The names of the asset routes are kept out
  of this file entirely, comments included, so the test that asserts this page
  asks for none of them has something exact to check.
-->
<style>
:root {
  --ground: #F3ECE1;
  --surface: #FFFDFA;
  --line: #E8DFD1;
  --ink: #2E251C;
  --muted: #6B5A48;
  --accent: #A8642E;
  --danger: #9A3B2B;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #362D24;
    --surface: #4A3E31;
    --line: #6B5A48;
    --ink: #F3ECE1;
    --muted: #A2917D;
    --accent: #D08A4A;
    --danger: #9A3B2B;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  /* `dvh` after `vh`, so a browser that knows only the older unit keeps the
     older value and a browser that knows both takes the second.

     It matters here more than anywhere else in this interface, because this is
     the FIRST page a phone sees: the operator taps a grant link. Mobile Chrome
     grows and shrinks its toolbar as you scroll, and `100vh` is measured
     against the LARGEST height the viewport ever has. So a page centred in
     `100vh` is centred in a box taller than what is actually visible, and its
     content sits low, under the address bar, until you scroll. `dvh` is the
     height the viewport has right now. #75 walks it on a real device.

     This page is served WITHOUT a token, so every byte of it is public. Keep
     it free of anything local: no names, no paths, no hostnames.
     `test_the_grant_page_names_nothing_on_the_machine` compares it byte for
     byte against the file on disk and refuses any of them. */
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--ground);
  color: var(--ink);
  /* System fonts here, and the difference from the main page is deliberate
     rather than left over (#76).

     This page is the one thing served WITHOUT a token, and it is self
     contained for that reason: every asset route stays behind the token, so a
     linked font would be answered 401 and arrive as nothing. The alternatives
     were an unauthenticated font route, which is public surface for something
     nobody needs, or inlining about 68KB of base64 into a door shown once.

     Named families first, so a machine that happens to have them installed
     matches the main page anyway. */
  font-family: Karla, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
main {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
}
h1 { font-family: "Zilla Slab", Georgia, serif; font-size: 22px; margin: 0 0 8px; }
p { margin: 0 0 16px; color: var(--muted); }
label { display: block; font-size: 13px; margin-bottom: 6px; }
input {
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  font: inherit;
  color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--line);
  border-radius: 8px;
}
button {
  width: 100%;
  min-height: 44px;
  margin-top: 12px;
  font: inherit;
  font-weight: 600;
  color: #FFFDFA;
  background: var(--accent);
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
.warn { color: var(--ink); font-weight: 600; }
.bad { color: var(--danger); font-weight: 600; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main role="dialog" aria-modal="true" aria-labelledby="title">
  <h1 id="title">hitchrail</h1>
  <p class="warn">Anyone with this key can run code on that machine as you.</p>
  <p data-working hidden>Checking.</p>
  <form data-form hidden>
    <label for="key">Access key</label>
    <!-- NO `name`. The form has no `action`, so a native submit would be
         `GET /grant?token=<key>`, which is the exact leak this page exists to
         end, and only `name` makes the value part of that submission. The
         script reads the field through `data-key` and never through form
         serialisation, so dropping it costs nothing. Today the fallback is
         unreachable because the form starts hidden, and an accidental guard is
         not one. -->
    <input id="key" type="password" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" data-key>
    <p class="bad" role="alert" data-error hidden></p>
    <button type="submit">Unlock</button>
  </form>
</main>
<script>
/* The whole point: a fragment is never sent to any server.

   Not the query string. A query string is written down by everything it passes
   through: the reverse proxy the README recommends for TLS logs `$request`,
   the `Referer` header carries it on any outbound request, and browser history
   sync carries it to every signed in device. #20 stopped Hitchrail's own log
   printing it, which was as far as Hitchrail's reach went. This is the fix. */
const form = document.querySelector("[data-form]");
const working = document.querySelector("[data-working]");
const error = document.querySelector("[data-error]");
const key = document.querySelector("[data-key]");

function fail(message) {
  working.hidden = true;
  form.hidden = false;
  error.textContent = message;
  error.hidden = false;
  key.focus();
}

async function grant(token) {
  let response;
  try {
    /* RELATIVE, and so are the two navigations below. This page is served
       from `/grant`, and the guard now compares the path the router matches
       on, so it is also reachable at `/<mount>/grant` behind a sub path proxy.
       An absolute `/api/grant` from there would POST the operator's key to the
       origin root, which is not Hitchrail: reachable with absolute URLs would
       have been worse than unreachable.

       From `/grant`, `api/grant` resolves to `/api/grant`. From
       `/hitchrail/grant` it resolves to `/hitchrail/api/grant`. Same file, no
       configuration, nothing to keep in step with the proxy. */
    response = await fetch("api/grant", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token }),
    });
  } catch {
    /* A rejected `fetch` is the network, not a refusal. Caught because the key
       is already out of the address bar by now, cleared before the request
       rather than after it, so a page stuck on "Checking." cannot be retried:
       the person would have to go back for the link. That is the cost of the
       clear, and this is what it buys back. */
    return false;
  }
  if (!response.ok) return false;
  /* No `replaceState` here. The key is already out of the address bar by this
     point, cleared before the request rather than after it, and clearing it a
     second time only looks like the thing protecting history.

     `replace` rather than an assignment, so this page is not a back target.
     That is a courtesy and not a control: the entry it would leave carries no
     key either. */
  window.location.replace("./");
  return true;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  error.hidden = true;
  const typed = key.value.trim();
  if (!typed) return;
  form.hidden = true;
  working.hidden = false;
  /* One message for a wrong key and for a missing one. The API refuses to be
     an oracle about which; the screen must not become the oracle instead. */
  if (!(await grant(typed))) fail("That key was not accepted. Check it and try again.");
});

const offered = new URLSearchParams(location.hash.slice(1)).get("token");
if (offered) {
  working.hidden = false;
  /* Cleared BEFORE the request, not after it. A rejected key would otherwise
     sit in the address bar, and in the history entry, for as long as the
     person stares at the failure. */
  history.replaceState(null, "", location.pathname);
  grant(offered).then((ok) => {
    if (!ok) fail("That key was not accepted. Check it and try again.");
  });
} else {
  form.hidden = false;
  key.focus();
}
</script>
</body>
</html>
