<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>hitchrail logs</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F3ECE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#362D24" media="(prefers-color-scheme: dark)">
</head>
<body class="logs-page">
<!-- #151. One project's tail at a URL you can bookmark. The project is read
     from this page's own address by logs.js and never written into this
     file: the server serves the same bytes for every name, which is what
     keeps pages.py reading only files it chose. Polled, not streamed: the
     roadmap defers streaming, and a tail on demand plus a refresh is enough
     until it demonstrably is not. -->
<header class="bar">
  <div class="bar-titles">
    <div class="bar-title-row">
      <svg class="bar-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="mark-ink" d="M3 19.5a1.25 1.25 0 0 1 1.25-1.25h15.5a1.25 1.25 0 1 1 0 2.5H4.25A1.25 1.25 0 0 1 3 19.5z"/><path class="mark-ink" d="M5.5 11a1.5 1.5 0 0 1 3 0v5.5a1.5 1.5 0 0 1-3 0zM15.5 11a1.5 1.5 0 0 1 3 0v5.5a1.5 1.5 0 0 1-3 0z"/><path class="mark-live" d="M10.25 6.75A1.75 1.75 0 0 1 12 5a1.75 1.75 0 0 1 1.75 1.75V16.5a1.75 1.75 0 0 1-3.5 0z"/></svg>
      <a class="bar-home" href="/" aria-label="hitchrail home"><h1 data-title>hitchrail</h1></a>
    </div>
    <p class="root" data-subtitle>logs</p>
  </div>
  <div class="bar-actions">
    <button type="button" class="ghost" data-refresh>Refresh</button>
  </div>
</header>
<p class="stream-note" role="status" data-note></p>
<main class="logs-main">
  <pre class="log-pane logs-full" data-pane></pre>
</main>
<script type="module" src="/logs.js"></script>
</body>
</html>
