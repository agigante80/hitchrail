# The five blocking gates, on every interpreter the package claims to support.
# All five are blocking on purpose: a gate that can be ignored is documentation.
# **Third party actions are pinned to a commit SHA, and the trailing `# vX.Y.Z` is
# documentation.** A tag is a mutable pointer: whoever controls the action
# repository can move it, and the code it lands on runs here. The SHA is the
# contract, the comment is only there so a human can read what version it is,
# and the two can disagree if somebody edits one. Resolve a new one with
# `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`. See #4.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. This workflow only reads the repository, and a write token
# on a package people install with `uvx` is supply chain surface.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Not fail-fast: a gate that breaks on 3.13 alone is a version
      # compatibility bug, and cancelling the other legs hides which it is.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # This used to read "setup-uv stopped publishing moving major tags after
      # v7, so this is pinned exactly". That reason is spent: since #4 every
      # action here is pinned to a SHA, so no tag mutability argument applies
      # to any one of them in particular.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      # --locked asserts uv.lock is current rather than quietly updating it,
      # so a forgotten lock change fails here instead of drifting.
      # tmux is a RUNTIME prerequisite of Hitchrail and a test prerequisite of
      # the live_tmux tier. Installed explicitly rather than relied on, because
      # that tier skips when tmux is absent and a tier that skips on every
      # runner looks like coverage while proving less than no tier at all.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      # Measured and reported, NOT gated. There is deliberately no fail_under:
      # docs/tech-guidelines.md section 7.4 rules out a percentage threshold,
      # because it is satisfied by executing lines without asserting on them.
      # The five gates above are the blocking ones.
      # The browser tier needs a browser, and the runner has none. Installed
      # after `uv sync` because the CLI comes from the dev dependency group.
      # `--with-deps` pulls the shared libraries headless chromium needs, which
      # a bare runner also lacks; without it the launch fails with a missing
      # .so rather than with anything about browsers.
      - run: uv run playwright install --with-deps chromium
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      # Assert the live_tmux tier actually RAN. Without this the suite stays
      # green while that tier silently skips, which is the failure the tier was
      # written to prevent: it exists because the hermetic tmux tests encode
      # the same belief the code does and cannot falsify it.
      # Same argument as the live_tmux guard below: a tier that silently
      # skips everywhere looks like coverage while proving less than none.
      # The browser tier is the only one that can see the stop escalation, the
      # phone viewport or a row's height, so a skip here is a whole class of
      # assertion quietly not running.
      - name: the browser tier must not have skipped
        run: |
          uv run pytest -m e2e -q --no-header | tee /tmp/e2e.txt
          grep -qE '[0-9]+ passed' /tmp/e2e.txt
          if grep -qE '[0-9]+ skipped' /tmp/e2e.txt; then
            echo "::error::the e2e tier skipped; chromium or tmux is missing"
            exit 1
          fi

      - name: the live tmux tier must not have skipped
        run: |
          uv run pytest -m live_tmux -q --no-header | tee /tmp/live_tmux.txt
          grep -qE '[0-9]+ passed' /tmp/live_tmux.txt
          if grep -qE '[0-9]+ skipped' /tmp/live_tmux.txt; then
            echo "::error::the live_tmux tier skipped; tmux is missing on this runner"
            exit 1
          fi
