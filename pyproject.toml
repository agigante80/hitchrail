[project]
name = "hitchrail"
version = "0.19.1"
description = "Start and stop headless Claude Code sessions across a folder of projects, from a phone-first web UI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "agigante80" }]
keywords = ["claude-code", "tmux", "session-manager", "self-hosted"]
classifiers = [
  # #157. No licence classifier here: it is deprecated under PEP 639, PyPI has
  # stopped accepting new ones, and `license = "MIT"` above already says the
  # same thing in the form the ecosystem standardised on. `uv build` warns on
  # one when it is present; it warns on nothing once it is gone.
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "starlette>=1.6,<2",
  "uvicorn>=0.52,<1",
  "sse-starlette>=3.4,<4",
]

[project.scripts]
hitchrail = "hitchrail.cli:main"

[project.urls]
Homepage = "https://github.com/agigante80/hitchrail"
Issues = "https://github.com/agigante80/hitchrail/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "httpx>=0.28",
  "ruff>=0.16",
  "mypy>=2.3",
  "import-linter>=2.13",
  "coverage[toml]>=7.15",
  "hypothesis>=6.165.10",
  "playwright>=1.50",
]
# Its own group, NOT in `dev`, and that is the point. Mutation testing is a
# Phase 7 pre release check run on demand, not a gate: `uv sync` should not
# pull nineteen more packages on every machine for a tool nobody runs daily.
# `uv sync --group mutation` when you want it.
#
# It cannot be `uvx`ed, which was the first plan. mutmut imports the test
# modules and runs pytest in process, so it needs an environment that already
# has starlette, httpx and the rest; an isolated tool install has none of them.
mutation = [
  "mutmut>=3.8,<4",
]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
# ruff 0.16 formats Python code fences inside Markdown, which reaches the plan
# documents and the adapted skills under .claude/. Those hold deliberately
# partial snippets ("add this to __init__"), so formatting them is not a
# no-op, and it would let a documentation edit fail a code formatting gate.
# The gate is for the project's Python; prose is reviewed by people.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
ignore = [
  # `assert`, which is how every test in this project states its claim.
  "S101",
  # N818 wants an Error suffix on every exception. This project's exceptions
  # are named as the refusals they are: `raise Protected(name)` and
  # `raise AlreadyExists(name)` read as the sentence the code is making, and
  # `ProtectedError` does not. Every one derives from ValueError or a
  # documented EngineError base, so the class is still recognisable as an
  # exception. The names are fixed across the implementation plan's declared
  # interfaces, so this is a vocabulary decision, not a per file exception.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# S603 is ruff's warning about subprocess calls. Silenced only in the three
# modules that legitimately run subprocesses, so the exception is visible in
# configuration rather than scattered through the code as inline noqa comments.
# `claude_ipc` joined them for #124: the plugin update is vendor knowledge,
# and its argv is built in the same module that runs it. Since #368 that module
# is `claude_ipc/plugins.py`, and the ignore names the file, not the package.
"src/hitchrail/tmux.py" = ["S603"]
"src/hitchrail/procs.py" = ["S603"]
"src/hitchrail/claude_ipc/plugins.py" = ["S603"]
# Tests are where the dangerous literals belong: a wildcard bind and a fake
# token are the subject matter of the security suite, not a leak. src/ stays
# strict, so a real 0.0.0.0 or credential in shipped code still fails.
"tests/*" = ["S104", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-ra --strict-markers --strict-config -m "not screenshots and not device"'
markers = [
  # The tier a test belongs to is a DECLARATION, not an inference from its
  # imports. Before this, the only way to tell an integration test from a unit
  # test was whether its file reached for `httpx.ASGITransport`, so a test that
  # stopped using it silently changed tier. See #37.
  "integration: drives the real Starlette app through httpx.ASGITransport, no socket",
  "e2e: drives a real browser against a real server; needs `playwright install chromium`",
  "live: binds a real loopback socket on an ephemeral port",
  "live_tmux: drives a real tmux server on a private socket",
  # #128. Runs the installed CONSOLE SCRIPT as a subprocess and reads what it
  # prints. Not folded into `e2e`, which means "a browser": no page is involved
  # here, and widening that word is how a tier stops describing anything.
  # Selected by default, because the path every user takes first should not be
  # opt in.
  "cli: runs the installed console script as a subprocess and reads its output",
  # Not a tier that runs anywhere. It drives a REAL Android over wireless adb,
  # so it needs hardware that is not in CI and is not always on the desk, and it
  # is deselected below for the same reason the screenshot marker is. `.claude/CLAUDE.md`:
  # a tier that skips everywhere looks like coverage while proving less than
  # none. This one is never silently skipped because it is never silently
  # selected. See #104.
  "device: drives a real Android phone over wireless adb; needs the device awake and paired",
  # Not a tier. It captures the interface into docs/screenshots/ and asserts
  # almost nothing, so it is deselected by default below and run on purpose at
  # a release. A capture that ran on every push would put a binary diff in
  # every pull request. See #105.
  "screenshots: captures the interface into docs/screenshots/, run on demand",
]

[tool.coverage.run]
source = ["hitchrail"]
branch = true

[tool.importlinter]
root_package = "hitchrail"
include_external_packages = true

# The engine layer is testable without HTTP, and this is what keeps it that
# way. Import boundaries defended only by good intentions do not survive.
# `hitchrail.security` is deliberately absent from source_modules: it is part
# of the web layer and imports Starlette on purpose.
[[tool.importlinter.contracts]]
name = "the engine layer knows nothing about the web"
type = "forbidden"
source_modules = [
  "hitchrail.attention",
  "hitchrail.config",
  "hitchrail.hostnames",
  "hitchrail.discovery",
  "hitchrail.gateway",
  "hitchrail.projectnames",
  "hitchrail.roots",
  "hitchrail.settings",
  "hitchrail.statefile",
  "hitchrail.tmux",
  "hitchrail.tmuxnames",
  "hitchrail.procs",
  "hitchrail.claude_ipc",
  "hitchrail.agy_ipc",
  "hitchrail.agent",
  "hitchrail.agentconfig",
  "hitchrail.agents",
  "hitchrail.ram",
  "hitchrail.events",
  "hitchrail.sessions",
  "hitchrail.derive",
  "hitchrail.engine",
  "hitchrail.signals",
  "hitchrail.sweep",
  "hitchrail.engine_seam",
  "hitchrail.stopmarker",
  "hitchrail.restart",
  "hitchrail.plugin_runs",
  "hitchrail.logs",
]
forbidden_modules = [
  "hitchrail.server",
  "hitchrail.cli",
  "starlette",
  "uvicorn",
  "sse_starlette",
]

# **There is deliberately no build target configuration here, and `web/` still
# ships.** #125. This held a `[tool.hatch.build.targets.wheel]` section whose
# comment said hatchling would otherwise leave the page out of the wheel. The
# backend is `uv_build`, so nothing read that section: it credited a mechanism
# that was not running for an outcome that happens for a different reason.
#
# The real reason: `uv_build` packages the whole `src/hitchrail/` tree, data
# files included, so `web/` is in the wheel because it lives inside the package
# rather than beside it. `pages.py` says the same thing from the other end, and
# that placement is the mechanism.
#
# What makes this safe to get wrong is in another file, which is why it is
# named here. `publish.yml` opens the built wheel and fails the release unless
# it carries `index.html`, `grant.html`, `app.js`, `app.css` and at least one
# font face. The failure it prevents is invisible until somebody installs the
# distribution and unfixable afterwards, because a version number on PyPI
# cannot be reused, only yanked.

# #35. Mutation testing over the modules between a web page and a shell, the
# ones `source_paths` lists below, and only those. Coverage says whether a line RAN; this says whether any
# assertion would have noticed the line being WRONG. Three defects in this
# project shipped green at 98% branch coverage, and one of them was a teardown
# assertion that ran after its socket was deleted and therefore could not fail.
#
# NOT the whole tree, and never a gate. A full run is slow enough that nobody
# runs it, and a check nobody runs is documentation. A score is satisfiable
# without improving anything, exactly like coverage, which `docs/tech-guidelines.md`
# 7.5 already refuses to gate on.
#
# Surviving mutants are READ, not counted. The output that matters is "this
# operator was flipped and every test still passed", which names one assertion
# that is missing or too loose.
#
# **`source_paths` is read by a test now, so it is two things.** #198 made
# `test_every_mutated_module_loads_the_security_rules_when_it_is_edited` derive
# its expectation from this list: a module curated here as being between a web
# page and a shell must also appear in `.claude/rules/security.md`'s `paths:`,
# or the security rules do not load when an agent edits it. Removing an entry
# here therefore stops a module loading those rules, which is a second
# consequence and not an obvious one.
[tool.mutmut]
source_paths = [
  "src/hitchrail/security.py",
  "src/hitchrail/hostnames.py",
  "src/hitchrail/config.py",
  "src/hitchrail/projectnames.py",
  "src/hitchrail/discovery.py",
  # #130. Added when multi root landed: `roots.py` decides which root an
  # identifier names and holds the injectivity argument that keeps two
  # projects off one tmux session. That is squarely between a web page and a
  # shell, so it is mutated rather than merely copied.
  #
  # Its ABSENCE was not a gap but a break: `config` and `discovery` both
  # import it, so the assembled tree could not import and `mutmut run` died
  # before scoring a mutant. #131 is the guard that now catches this.
  "src/hitchrail/roots.py",
  # #273. Both arrived in Phase 14 and met neither list. `settings.py` reads
  # the file that draws the root boundary and writes the state file, and
  # its mode check is three clauses a mutant can flip one at a time;
  # `gateway.py` decides whether the unit starts at all from two `/proc`
  # tables, byte order and a flag test included. Between a web page and a
  # shell in the sense that matters: what runs, and where. #443 moved the state
  # file and `Preferences` to `statefile.py`, which the sweep scores beside it.
  "src/hitchrail/settings.py",
  "src/hitchrail/statefile.py",
  "src/hitchrail/gateway.py",
  # #130 asked whether this belongs here and required the answer with a
  # number. **Measured on 2026-09-05: adding it takes the sweep from 829
  # mutants to 1133, and from 91 seconds to 104.** Thirteen seconds, which is
  # not a trade worth thinking about twice.
  #
  # It earns the place on merit rather than on cheapness. `sanitize`'s
  # injectivity became load bearing for the multi root identifier at #119: it
  # is what stops `work~a.b` and `work~a-b` reaching one session. Its own
  # docstring argues at length that injectivity is the hard requirement and
  # that a digest suffix did not deliver it, which is exactly the class of
  # claim a sweep exists to check rather than take on trust.
  #
  # The first run with it reported 48 mutants with NO covering test, which is
  # a coverage gap this module was hiding by not being here.
  "src/hitchrail/tmux.py",
  # #93 split the name vocabulary out of the adapter. It stays mutated for the
  # reason it was mutated inside `tmux.py`: `sanitize`'s injectivity is what
  # stops two projects reaching one session, and since #119 that carries the
  # multi root guarantee.
  "src/hitchrail/tmuxnames.py",
  # #304. Was `also_copy` only: mutated by nothing, despite being the
  # quarantine module that builds `launch_argv` and now runs the plugin
  # update's own argv, both between a web page and a shell. `.claude/rules/
  # security.md` already listed it; this list did not, which is the half of
  # the ticket that was true.
  #
  # A package since #368, and only `plugins.py` is listed: the plugin section
  # is what was mutated before the split, and the other four modules are in
  # `also_copy` below, by name, so the package imports in the mutants tree.
  #
  # The whole package is over a thousand lines, most of it `launch_argv`,
  # `request_stop` and the tmux IPC key sequences, which `test_claude_ipc.py`
  # already exercises hard without mutmut. Mutating all of it would make a
  # single sweep the minutes the premortem above warns against for a much
  # smaller file. `pytest_add_cli_args_test_selection` below stays scoped to
  # `tests/test_plugins.py`, which is the suite that drives `update_plugins`
  # end to end through an injected `FakeAgent`, and the run itself is scoped
  # to the plugin section's mutant names (`update_plugins`, `_call`,
  # `_update_one`, `_read_listing`, `_approved_command`, `_detail`, `_shown`,
  # `plugin_runner`) rather than to every mutant the file has. Widening
  # either list to the rest of the module is future work, not this ticket.
  "src/hitchrail/claude_ipc/plugins.py",
  # #274. The pidfd path left `engine.py`, which is copied and never mutated
  # because mutating all of it is not affordable. Out of it, the one
  # destructive path scoped by a check rather than by the tmux prefix is
  # three hundred lines and mutated on its own, against `test_signal.py`'s
  # recorder fakes, which never open a real handle.
  "src/hitchrail/signals.py",
]
# The tests that actually exercise the modules in `source_paths`. The full suite takes 34 seconds
# and would make a single run hours; these 441 take 1.5, which is what makes
# the difference between a check that runs and one that is described.
# The `source_paths` modules are copied mutated; everything else the tests import
# has to be copied verbatim or the package will not import. Listed rather than
# globbed on `src/hitchrail/`, which would copy the mutated files back over
# themselves and make every run report zero mutants killed.
also_copy = [
  "src/hitchrail/__init__.py",
  # #368: the package around the one mutated module.
  "src/hitchrail/claude_ipc/__init__.py",
  # #290. Copied, not mutated: every agent package and the engine import the
  # interface, and the engine builds its agents from `agents.py`. The closed
  # mapping there is pinned by the config refusal tests directly.
  "src/hitchrail/claude_ipc/adapter.py",
  "src/hitchrail/agent.py",
  "src/hitchrail/agentconfig.py",
  "src/hitchrail/agents.py",
  "src/hitchrail/claude_ipc/exit_menu.py",
  "src/hitchrail/claude_ipc/keys.py",
  "src/hitchrail/claude_ipc/launch.py",
  "src/hitchrail/claude_ipc/screen.py",
  # #294. The second agent package, copied because `agents.py` imports it.
  "src/hitchrail/agy_ipc/__init__.py",
  "src/hitchrail/agy_ipc/adapter.py",
  "src/hitchrail/agy_ipc/keys.py",
  "src/hitchrail/agy_ipc/launch.py",
  "src/hitchrail/agy_ipc/screen.py",
  # #221. Copied rather than mutated, and its ABSENCE was not a gap but a
  # break: `engine.py` imports it, so the assembled tree had the importer and
  # not the module, `tests/conftest.py` failed to import, and pytest exited 4.
  # mutmut reports that as "Failed to run pytest with args", which reads as a
  # malformed command rather than a missing file, and the sweep could not start
  # at all. Whether it should be MUTATED is a separate question: nothing in it
  # spawns and its capture arrives injected, so it is not obviously between a
  # web page and a shell.
  "src/hitchrail/attention.py",
  "src/hitchrail/cli.py",
  "src/hitchrail/derive.py",
  "src/hitchrail/engine.py",
  # #473. Copied, not mutated: `engine.py` imports it.
  "src/hitchrail/sweep.py",
  # #424. Copied, not mutated: `engine.py` inherits from it.
  "src/hitchrail/engine_seam.py",
  # Phase 26. Copied, not mutated: `engine.py` imports it.
  "src/hitchrail/stopmarker.py",
  # #472. Copied, not mutated: `engine.py` inherits from it.
  "src/hitchrail/restart.py",
  "src/hitchrail/events.py",
  "src/hitchrail/headers.py",
  # #167. Copied, not mutated: `security.py` escapes request values through
  # `logs.shown` before logging them, so the tree cannot import without it,
  # but nothing in it reaches a shell. What it must never write is pinned by
  # `tests/test_logs.py` directly.
  "src/hitchrail/logs.py",
  "src/hitchrail/pages.py",
  "src/hitchrail/plugin_runs.py",
  "src/hitchrail/procs.py",
  "src/hitchrail/ram.py",
  "src/hitchrail/lifespan.py",
  "src/hitchrail/routes_common.py",
  "src/hitchrail/routes_live.py",
  "src/hitchrail/routes_projects.py",
  "src/hitchrail/routes_sessions.py",
  "src/hitchrail/routes_settings.py",
  # #205. Copied for the reason `attention.py` is: `server.py` imports every
  # route module it was split into, so a tree with the importer and not them
  # cannot start.
  "src/hitchrail/server.py",
  "src/hitchrail/sessions.py",
  "src/hitchrail/web",
  # The whole directory, not `tests/conftest.py`: `also_copy` does not create
  # parent directories, so naming the file alone fails on a clean `mutants/`
  # and only appeared to work while a previous run had left the tree behind.
  "tests",
  # `tests/test_api.py` reads `docs/api.md` to hold the payload tables to the
  # server both ways, and the mutants tree had no docs at all, so the run
  # died on the first mutant of anything (#273 found it; it predates it).
  # The directory, for the reason `tests` is the directory.
  "docs",
]
# **The repo shape guards have to come out, and the reason is instructive.**
# mutmut copies the tree and writes every mutant of a module into one file, so
# under a run `security.py` is 20877 lines and `hostnames.py` 4205. Any test
# that reads the SOURCE is then inspecting a tree that is not the repository:
# the size cap guard fails on every mutant, the import contract sees a shape
# nobody wrote, and `-x` stops the run before a single mutant is scored.
#
# They are not weakened by this. They run in the ordinary suite, where the tree
# they inspect is the real one, which is the only place their answer means
# anything.
#
# **#221 added the fifth**, and it is the same shape from the other end.
# `test_the_sweep_drives_every_public_method` reads `vars(Tmux)` and
# `inspect.getsource`, so under a run it sees every `xǁTmuxǁmethod__mutmut_N`
# variant as a public method the driver never calls. The mutant names do not
# start with an underscore, so the test's own filter does not exclude them.
#
# This list is maintained by hand and rots loudly rather than quietly:
# a `--deselect` naming a test that no longer exists makes pytest exit 4, which
# mutmut reports as "Failed to run pytest with args" and which cost a day of
# reading a valid command as a malformed one.
# `test_every_test_the_sweep_deselects_still_exists` is why it cannot.
# **#273 added the sixth**, and it reads the source too: it parses every
# `os.environ.get(X)` in `src/` for X, and a mutant of `settings.py` carries
# `os.environ.get(None)` beside the real call, which no scrub list names.
# **#374 added the seventh**, and mutmut 3.8 is why. 3.7 skipped the methods
# of a decorated class, so `Config.__post_init__` was never mutated; 3.8
# mutates it, and `test_every_read_of_agent_binary_is_the_resolved_property_
# or_allowlisted` reads every `self.agent_binary` in the source, finds one per
# `xǁConfigǁ__post_init____mutmut_N` copy, and none of them is the allowlisted
# `__post_init__`.
pytest_add_cli_args = [
  "--deselect=tests/test_source_guards.py::test_every_read_of_agent_binary_is_the_resolved_property_or_allowlisted",
  "--deselect=tests/test_source_guards.py::test_every_environment_variable_the_product_reads_is_scrubbed",
  "--deselect=tests/test_size_guideline.py::test_every_module_is_under_the_size_guideline",
  "--deselect=tests/test_source_guards.py::test_the_import_contract_covers_every_engine_layer_module",
  "--deselect=tests/test_source_guards.py::test_projectnames_does_not_import_config",
  "--deselect=tests/test_source_guards.py::test_hostnames_does_not_import_config",
  "--deselect=tests/test_tmux.py::test_the_sweep_drives_every_public_method",
]
pytest_add_cli_args_test_selection = [
  "tests/test_security_host.py",
  "tests/test_security_token.py",
  "tests/test_security_origin.py",
  "tests/test_headers.py",
  # #30 split one 2884 line file into these; every one of them was in the
  # selection then, so every one of them still is.
  "tests/test_config.py",
  "tests/test_config_hosts.py",
  "tests/test_config_origins.py",
  "tests/test_config_reach.py",
  "tests/test_hostnames.py",
  "tests/test_local_addresses.py",
  "tests/test_source_guards.py",
  "tests/test_size_guideline.py",
  "tests/test_mutation_config.py",
  "tests/test_security_rules.py",
  "tests/test_discovery.py",
  "tests/test_properties.py",
  # The integration tier belongs here even though it costs four seconds a
  # mutant instead of one and a half. Without it, mutants in the three
  # middlewares survive against test doubles that never read a request body or
  # exercise a real route, and the run reports a gap in the suite that is
  # really a gap in this list.
  "tests/test_api.py",
  # The assertions this check produced. They belong in the selection or the
  # next run reports the mutants they kill as surviving again.
  "tests/test_mutation_survivors.py",
  # #377's kills in `config.py`, in their own file for the same reason.
  "tests/test_config_mutants.py",
  # The 26 tests that kill mutants in `roots.py`, and some in `config` and
  # `discovery` that only these reach. Without them the run reports gaps in
  # the suite that are really gaps in this list.
  "tests/test_roots.py",
  # The suite that kills mutants in `tmux.py`, hermetic: `Tmux` takes its
  # runner injected, so nothing here spawns a real tmux and no mutant can
  # leak a process group.
  "tests/test_tmux.py",
  "tests/test_tmuxnames.py",
  # #273. The suites that reach `settings.py` and `gateway.py`, both
  # hermetic: tables and files a test wrote, the nudge a recorder.
  "tests/test_settings_file.py",
  "tests/test_settings_route.py",
  "tests/test_gateway.py",
  # #304. Drives `update_plugins` end to end through an injected `FakeAgent`,
  # which is what actually reaches `_read_listing`, `_approved_command`,
  # `_detail` and `_shown`: `test_plugin_route.py` and `test_plugin_runs.py`
  # exercise the thread and route around the operation but stub the operation
  # itself out through `no_real_plugin_update`, so they cannot kill a mutant
  # inside it.
  "tests/test_plugins.py",
  # #274. Drives `signals.py` through `FakePidfd` and scripted tables: every
  # refusal and the order of handle, look and send, hermetic.
  "tests/test_signal.py",
  # #487. `statefile.Preferences` is mutated and this file is what drives its
  # stop policy: persisted, pinned by the config, and reloaded.
  "tests/test_stop_policy.py",
]
